services:
  discordmusicbot:
    container_name: discordmusicbot
    build: .
    image: discordmusicbot:local
    network_mode: host
    restart: always
    environment:
      PUBLIC_STATUS_API_ENABLED: ${PUBLIC_STATUS_API_ENABLED:-false}
      PUBLIC_STATUS_HOST: ${PUBLIC_STATUS_HOST:-127.0.0.1}
      PUBLIC_STATUS_PORT: ${PUBLIC_STATUS_PORT:-3000}
    volumes:
      - ./config.js:/usr/src/app/config.js:ro
      - ./commands:/usr/src/app/commands
      - ./lib:/usr/src/app/lib
      - ./events:/usr/src/app/events
      - ./util:/usr/src/app/util
      - ./api:/usr/src/app/api
      - ./index.js:/usr/src/app/index.js
      - ./data:/usr/src/app/data

  caddy:
    image: caddy:2-alpine
    container_name: musicbot-api-caddy
    restart: always
    profiles:
      - web-api
    depends_on:
      - discordmusicbot
    network_mode: host
    environment:
      PUBLIC_STATUS_DOMAIN: ${PUBLIC_STATUS_DOMAIN:-localhost}
      PUBLIC_STATUS_PORT: ${PUBLIC_STATUS_PORT:-3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
