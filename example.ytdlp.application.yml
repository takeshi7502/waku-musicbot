# Copy this file to application.yml only when using run.sh mode 2.
# It deliberately does not load youtube-source: LavaSrc calls the local yt-dlp
# binary for YouTube searches, URLs, and playback metadata instead.
server:
  port: 3333
  # Public bind for a bot on another host. Restrict TCP 3333 in the firewall to
  # the bot's IP address instead of exposing it to the whole internet.
  address: 0.0.0.0

lavalink:
  server:
    password: "takeshi.dev"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    bufferDurationMs: 225
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 3
    opusEncodingQuality: 5
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 5000
    playerUpdateInterval: 3
    useSeekGhosting: true
    soundcloudSearchEnabled: true
    gc-warnings: true
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      ytdlp: true
    lyrics-sources:
      # YouTube lyrics use LavaSearch, which requires youtube-source. Keep it
      # off in yt-dlp-only mode; LRCLIB lyrics remain available.
      youtube: false
      lrcLib: true
    spotify:
      clientId: ""
      clientSecret: ""
      resolveArtistsInSearch: true
      albumLoadLimit: 2
      countryCode: "US"
      playlistLoadLimit: 3
      localFiles: true
    ytdlp:
      # run.sh replaces this placeholder with the absolute downloaded binary path.
      path: "__YTDLP_PATH__"
      searchLimit: 10
      playlistLoadLimit: 1000
      customLoadArgs:
        - "-q"
        - "--no-warnings"
        - "--force-ipv4"
        - "--flat-playlist"
        - "--skip-download"
        - "-J"
      customPlaybackArgs:
        - "-q"
        - "--no-warnings"
        - "--force-ipv4"
        - "-f"
        - "bestaudio"
        - "-J"

logging:
  file:
    path: ./logs/
  level:
    root: INFO
  request:
    # Dashboard polling remains quiet; warnings and errors are still logged.
    enabled: false
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: false
    includePayload: false
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
